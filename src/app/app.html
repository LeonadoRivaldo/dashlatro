<div class="app-shell">
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" routerLink="/"><i class="fa-solid fa-dice me-2"></i>Dashlatro</a>

      <div class="ms-auto d-flex align-items-center gap-2">
        @if (isAuthenticated()) {
          <span class="small text-secondary d-none d-md-inline">{{ user()?.displayName || user()?.email }}</span>
          <button class="btn btn-outline-dark btn-sm" type="button" (click)="signOut()">{{ 'AUTH.LOGOUT' | translate }}</button>
        }
        <div class="lang-dropdown">
          <button
            class="btn btn-light border btn-sm lang-toggle"
            type="button"
            (click)="toggleLanguageMenu()"
            [attr.aria-expanded]="languageMenuOpen()"
            [attr.aria-label]="'LANGUAGE.SELECT' | translate"
          >
            <img class="flag-icon" [src]="currentFlag()" alt="" />
          </button>

          @if (languageMenuOpen()) {
            <div class="lang-menu shadow-sm">
              @for (language of languageOptions; track language.code) {
                <button
                  class="btn btn-light lang-option"
                  type="button"
                  [attr.aria-label]="language.label"
                  (click)="setLanguage(language.code)"
                >
                  <img class="flag-icon" [src]="language.flag" [alt]="language.label" />
                </button>
              }
            </div>
          }
        </div>
      </div>
    </div>
  </nav>

  <main class="app-content">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <div class="container footer-content">
      <small>
        {{ 'FOOTER.DISCLAIMER' | translate:{ year: 2026 } }}
      </small>
      <a href="https://www.playbalatro.com/" target="_blank" rel="noopener noreferrer">{{ 'FOOTER.OFFICIAL_SITE' | translate }}</a>
    </div>
  </footer>
</div>
